<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LONGEVEATS — Conscious Food</title>
  <meta name="description" content="LONGEVEATS. Conscious food, breakfast and lunch in Milan.">
  <meta name="theme-color" content="#F3EFE4">
  <link rel="icon" href="assets/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="64x64" href="assets/favicon-64.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon-180.png">
  <link rel="stylesheet" href="style.css">
</head>
<body class="home">

  <header class="hero">
    <!-- the photo lives inside the first screen, so it scrolls away with it -->
    <div class="backdrop" aria-hidden="true"></div>
    <nav class="topbar">
      <a class="logo" href="./">
        <img src="assets/logo.png" alt="LONGEVEATS — Conscious Food" width="360" height="136">
      </a>
      <a class="btn" href="menu.html">View the menu</a>
    </nav>

    <div class="hero-body">
      <ul class="pillars">
        <li>Joyful Food</li>
        <li>Conscious Eating</li>
        <li>Mindful Nutrition</li>
      </ul>
    </div>

    <section class="locations" aria-label="Our locations">
      <div class="location">
        <h2>Porta Romana</h2>
        <p>Corso di Porta Romana 85</p>
        <p class="hours">Mon–Sat 08:00–16:00</p>
      </div>
      <div class="location">
        <h2>Vespucci</h2>
        <p>Via A. Vespucci 11</p>
        <p class="hours">Mon–Sat 08:00–16:00</p>
      </div>
    </section>
    <p class="walkins">No reservations – Walk-ins only.</p>
  </header>

  <footer class="footer">
    <div class="footer-inner">
      <img class="footer-photo" src="assets/interior.jpg" alt="Inside a LONGEVEATS café" width="160" height="160">

      <div class="footer-cols">
        <div class="footer-col">
          <p class="social">
            <a href="https://www.instagram.com/longeveats_consciouseating/" aria-label="Instagram" target="_blank" rel="noopener">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r=".9" fill="currentColor" stroke="none"/></svg>
            </a>
          </p>
        </div>
        <div class="footer-col">
          <p>Conscious Srl Società Benefit<br>Via Caradosso 18, 20123 Milano<br>VAT IT14680570968</p>
        </div>
      </div>
    </div>
  </footer>

  <script>
    /* as the page scrolls, the text fades out exactly where it meets the
       bottom of the fixed header; the photo is left untouched */
    (function () {
      var header = document.querySelector('.topbar');
      var blocks = document.querySelectorAll('.pillars, .locations, .walkins');
      var ticking = false;
      var update = function () {
        var line = header.getBoundingClientRect().bottom + 20;
        blocks.forEach(function (el) {
          var cut = Math.max(0, line - el.getBoundingClientRect().top);
          el.style.setProperty('--cut', cut + 'px');
        });
        ticking = false;
      };
      var request = function () {
        if (!ticking) { ticking = true; window.requestAnimationFrame(update); }
      };
      window.addEventListener('scroll', request, { passive: true });
      window.addEventListener('resize', request);
      update();
    })();
  </script>
</body>
</html>
